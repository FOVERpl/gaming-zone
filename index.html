<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Zone - Strona Główna</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/x-icon" href="icona.png">


</head>
<body>

<nav>
    <div class="logo">GAMING-ZONE</div>
    <ul class="nav-links">
        <li><a href="index.html">Główna</a></li>
        <li><a href="nowosci.html">Nowości</a></li>
        <li><a href="informacje.html">O nas</a></li>
        <li><a href="regulamin.html">Regulamin</a></li>
        <li id="profile-link" style="display:none;"><a href="profile.html">MÓJ PROFIL</a></li>
    </ul>
</nav>

<main>
<section id="hero">
        <div class="auth-container" id="auth-section">
            <div class="tabs">
                <button class="tab-btn active" onclick="openTab('login')">Logowanie</button>
                <button class="tab-btn" onclick="openTab('register')">Rejestracja</button>
            </div>

            <div id="login" class="tab-content active">
                <form id="login-form">
                    <input type="email" id="l-email" placeholder="E-mail" required>
                    <input type="password" id="l-password" placeholder="Hasło" required>
                    <button type="submit" class="btn-main">Zaloguj się</button>
                </form>
            </div>

            <div id="register" class="tab-content">
                <form id="register-form">
                    <input type="text" id="r-username" placeholder="Twoja Ksywka" required>
                    <input type="email" id="r-email" placeholder="E-mail" required>
                    <input type="password" id="r-password" placeholder="Hasło" required>
                    <button type="submit" class="btn-main">Załóż konto</button>
                </form>
            </div>
        </div>
    </section>

    <section class="bottom-content">
        <div class="content-container">
            <h2>Witaj w Gaming Zone</h2>
           

        </div>

        <div class="features">
    <div class="feature-card">
        <h3>Najnowsze Recenzje</h3>
        <p>Sprawdź co sądzimy o najnowszym DLC do Elden Ring...</p>
    </div>
    <div class="feature-card">
        <h3>Nadchodzące Premiery</h3>
        <p>Kalendarz premier na nadchodzący miesiąc.</p>
    </div>
    <div class="feature-card">
        <h3>Strefa Widza</h3>
        <p>Najciekawsze streamy naszych użytkowników.</p>
    </div>
</div>





    </section>
</main>

<script src="auth.js"></script>

<script>
    function openTab(name) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(name).classList.add('active');
        event.currentTarget.classList.add('active');
    }
</script>

</body>
</html>
